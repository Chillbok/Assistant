name: assistant

services:
  bot:
    build: .
    image: assistant:dev
    restart: on-failure:5
    init: true
    user: "1654:1654"
    env_file:
      - ${HOME}/.config/assistant/env
    environment:
      TZ: ${TZ:-UTC}
      HOME: /tmp
      DOTNET_EnableDiagnostics: "0"
    # 부팅 시 Tailscale이 /etc/resolv.conf를 덮어쓰기 전에 Docker가 시작하면
    # 컨테이너 DNS가 비어 버린다. 순서에 의존하지 않도록 명시한다.
    dns:
      - 100.100.100.100
      - 1.1.1.1
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
