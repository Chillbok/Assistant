name: assistant

services:
  bot:
    build: .
    image: assistant:dev
    restart: on-failure:5
    init: true
    user: "1654:1654"
    env_file:
      - ${HOME}/.config/assistant/env
    environment:
      TZ: ${TZ:-UTC}
      HOME: /tmp
      DOTNET_EnableDiagnostics: "0"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
