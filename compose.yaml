name: assistant

services:
  bot:
    build: .
    image: assistant:dev
    restart: unless-stopped
    env_file:
      - ${ASSISTANT_ENV:-/home/junho/.config/assistant/env}
    environment:
      TZ: Asia/Seoul
      HOME: /tmp
      DOTNET_EnableDiagnostics: "0"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
